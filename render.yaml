# Render Blueprint for Civora Unified Backend
services:
  - type: web
    name: civora-backend-api
    runtime: python
    rootDir: unifed_civora_backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: CIVORA_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:3001"
      - key: CIVORA_ADMIN_EMAIL
        value: "admin@civora.internal"
      - key: CIVORA_ADMIN_PASSWORD
        value: "Civora2026!"
      - key: CIVORA_ADMIN_NAME
        value: "Engr. Babatunde Fashola-Smith"
